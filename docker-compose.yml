services:
  web:
    build:
      context: .
      target: dependencies
    command: npm run dev -- --hostname 0.0.0.0
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/sensishop
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: sensishop-local
      S3_SECRET_ACCESS_KEY: local-minio-secret-change-me
      S3_BUCKET: sensishop-media
      S3_FORCE_PATH_STYLE: "true"
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - sensishop_node_modules:/app/node_modules
      - sensishop_next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sensishop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sensishop_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sensishop"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sensishop-local
      MINIO_ROOT_PASSWORD: local-minio-secret-change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sensishop_media:/data

volumes:
  sensishop_node_modules:
  sensishop_next_cache:
  sensishop_postgres:
  sensishop_media:
